<div class="login-container">
  <div class="login-left">
    <div class="login-left-content">
      <h2>LearnHub</h2>
      <p>Learning Management System</p>
      <div class="login-preview">
        <!-- Placeholder for illustration -->
        <div class="placeholder-box">Dashboard Preview</div>
      </div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-form-wrapper">
      <div class="login-header">
        <h1>Welcome Back! 👋</h1>
        <p>Login to continue your learning journey</p>
      </div>

      <div class="login-tabs">
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'student'"
          (click)="activeTab = 'student'">
          <span class="icon">👤</span> Student Login
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'teacher'"
          (click)="activeTab = 'teacher'">
          <span class="icon">👨‍🏫</span> Teacher / Admin Login
        </button>
      </div>

      <form (ngSubmit)="onSignIn()" class="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input 
              type="email" 
              [(ngModel)]="email" 
              name="email"
              placeholder="Enter your email address" 
              class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper password-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password"
              placeholder="Enter your password" 
              class="form-control">
            <button type="button" class="toggle-password">👁️</button>
          </div>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <div class="form-group checkbox">
          <input 
            type="checkbox" 
            [(ngModel)]="rememberMe" 
            name="rememberMe"
            id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-green btn-sign-in">Sign In →</button>
      </form>

      <div class="login-divider">or continue with</div>

      <div class="social-login">
        <button class="social-btn">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext%3EGoogle%3C/text%3E%3C/svg%3E" alt="Google">
          Google
        </button>
        <button class="social-btn">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext%3EMicrosoft%3C/text%3E%3C/svg%3E" alt="Microsoft">
          Microsoft
        </button>
        <button class="social-btn">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext%3EApple%3C/text%3E%3C/svg%3E" alt="Apple">
          Apple
        </button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="#" (click)="onSignUp()">Sign Up</a>
      </div>
    </div>
  </div>
</div>
